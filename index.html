<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adventures</title>
<meta name="description" content="Trip stories from Jay Aigner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
:root {
  --sky: #dff1ff;
  --paper: #fffdf7;
  --ink: #14263a;
  --muted: #4d6175;
  --sun: #ffc93c;
  --forest: #2f7d4f;
  --lake: #1679a8;
  --coral: #ff6b4a;
  --card: #ffffff;
  --line: #d7e3ec;
  --tape: rgba(255, 201, 60, .72);
  --shadow: 0 10px 30px rgba(20, 38, 58, .14);
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Caveat", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #12263a; --paper: #0d1824; --ink: #eef5fb; --muted: #a9bccd; --sun: #ffcf4d;
    --forest: #6fd39a; --lake: #5cc2f0; --coral: #ff8a6e; --card: #172636; --line: #24394d;
    --tape: rgba(255, 207, 77, .55); --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #12263a; --paper: #0d1824; --ink: #eef5fb; --muted: #a9bccd; --sun: #ffcf4d;
  --forest: #6fd39a; --lake: #5cc2f0; --coral: #ff8a6e; --card: #172636; --line: #24394d;
  --tape: rgba(255, 207, 77, .55); --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.6; }
img { max-width: 100%; display: block; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { background: var(--sky); }
header .wrap { padding-block: 3.5rem 3rem; display: grid; gap: .75rem; }
.eyebrow { font-weight: 600; text-transform: uppercase; letter-spacing: .12em; font-size: .85rem; color: var(--forest); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 9vw, 5.5rem); line-height: 1; letter-spacing: -.03em; margin: 0; }
h1 span { background: var(--sun); color: #14263a; padding: 0 .15em; border-radius: .12em; }
main .wrap { padding-block: 3rem 4.5rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 24px; }
.card { display: grid; background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); color: inherit; text-decoration: none; transition: transform .2s ease; }
.card:hover, .card:focus-visible { transform: translateY(-4px) rotate(-.4deg); }
.card:focus-visible { outline: 3px solid var(--lake); outline-offset: 3px; }
.card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: center 30%; }
.card .body { padding: 1.1rem 1.25rem 1.4rem; display: grid; gap: .4rem; }
.route { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--lake); }
.card h2 { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.date { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="eyebrow">Jay Aigner</span>
    <h1><span>Adventures</span></h1>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="grid">
      <!-- New stories: copy this card, newest first -->
      <a class="card" href="same-mfn-dudes/">
        <img src="same-mfn-dudes/media/hero-selfie.jpg" alt="Selfie of Jay with the two travelers from the story">
        <div class="body">
          <span class="route">Cuyahoga Valley, OH &rarr; Indiana Dunes, IN</span>
          <h2>Same MF'n dudes 300 miles apart</h2>
          <span class="date">July 19&ndash;20, 2026</span>
        </div>
      </a>
    </div>
  </div>
</main>
</body>
</html>
